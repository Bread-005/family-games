<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Generator</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" type="module"></script>
</head>
<body>
    <section id="team-section">
        <h1>Team Generator</h1>
        <div class="card">
            <label for="player-names">Spielernamen (mit Komma getrennt)</label>
            <textarea id="player-names" placeholder="Name1, Name2, Name3..." rows="4"></textarea>
            <button id="generate-teams-btn" class="button-secondary">Teams & Reihenfolge auslosen</button>
        </div>

        <div class="card">
            <h2>Zugreihenfolge</h2>
            <div id="turn-order-list" style="line-height: 2;"></div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
            <div class="card" style="border-top: 5px solid #3b82f6;">
                <h2 style="color: #3b82f6;">Team Blau</h2>
                <ul id="team-blue-list" style="list-style: none; padding: 0;"></ul>
            </div>
            <div class="card" style="border-top: 5px solid #ef4444;">
                <h2 style="color: #ef4444;">Team Rot</h2>
                <ul id="team-red-list" style="list-style: none; padding: 0;"></ul>
            </div>
        </div>
    </section>
</body>
</html>
