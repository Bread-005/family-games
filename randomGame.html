<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Game Picker</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" type="module"></script>
</head>
<body>
    <section id="filter-section">
        <h1>Game Randomizer</h1>
        <div class="card filter-controls">
            <input type="number" id="filter-players" placeholder="Wie viele Spieler seit ihr?" min="0">
            <input type="number" id="filter-time" placeholder="Wie lange habt ihr maximal Zeit?" min="0">
            <button id="pick-random-games-button" class="button-secondary">Get 5 Suggestions</button>
        </div>
        <div id="random-results" class="grid"></div>
    </section>
</body>
</html>
